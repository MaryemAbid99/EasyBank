version: '3.8'

services:
  easybank-postgres:
    image: postgres:15
    container_name: easybank-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: easybank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      easybank_network:
        ipv4_address: 172.20.0.2

  easybank-pgadmin:
    image: dpage/pgadmin4
    container_name: easybank-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@easybank.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - easybank-postgres
    networks:
      easybank_network:
        ipv4_address: 172.20.0.3

volumes:
  postgres_data:

networks:
  easybank_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
